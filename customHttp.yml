customHeaders:
  - pattern: '**'
    headers:
      - key: X-Content-Type-Options
        value: nosniff
      - key: Referrer-Policy
        value: no-referrer
      - key: Strict-Transport-Security
        value: max-age=15552000
      - key: Content-Security-Policy
        value: "default-src 'self'; style-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
      - key: Cache-Control
        value: no-cache
